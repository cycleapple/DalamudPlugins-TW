name: Validate distribution repository

on:
  push:
    paths:
      - 'repo.json'
      - 'README.md'
      - '.github/**'
      - 'icons/**'
      - 'plugins/**'
  pull_request:
    paths:
      - 'repo.json'
      - 'README.md'
      - '.github/**'
      - 'icons/**'
      - 'plugins/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repo.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          repo_path = Path('repo.json')
          data = json.loads(repo_path.read_text(encoding='utf-8'))
          if not isinstance(data, list):
              raise SystemExit('repo.json root must be a JSON array')

          required_fields = [
              'Author', 'Name', 'InternalName', 'AssemblyVersion', 'TestingAssemblyVersion',
              'RepoUrl', 'ApplicableVersion', 'Punchline', 'Description',
              'DalamudApiLevel', 'TestingDalamudApiLevel', 'DownloadCount', 'LastUpdate',
              'LoadPriority', 'LoadRequiredState', 'LoadSync', 'DownloadLinkInstall',
              'DownloadLinkTesting', 'DownloadLinkUpdate', 'IconUrl', 'IsHide', 'IsTestingExclusive'
          ]

          for index, entry in enumerate(data, start=1):
              if not isinstance(entry, dict):
                  raise SystemExit(f'Entry {index} must be an object')
              for field in required_fields:
                  if field not in entry:
                      raise SystemExit(f'Entry {index} missing required field: {field}')
              if entry['DalamudApiLevel'] != 13:
                  raise SystemExit(f'Entry {index} has non-API13 DalamudApiLevel: {entry["DalamudApiLevel"]}')
              if entry['TestingDalamudApiLevel'] != 13:
                  raise SystemExit(f'Entry {index} has non-API13 TestingDalamudApiLevel: {entry["TestingDalamudApiLevel"]}')
              if not isinstance(entry['Name'], str) or not entry['Name'].strip():
                  raise SystemExit(f'Entry {index} has invalid Name')
              for link_field in ['RepoUrl', 'DownloadLinkInstall', 'DownloadLinkTesting', 'DownloadLinkUpdate', 'IconUrl']:
                  if not isinstance(entry[link_field], str) or not entry[link_field].strip():
                      raise SystemExit(f'Entry {index} has invalid {link_field}')
              icon_url = entry['IconUrl']
              prefix = 'https://raw.githubusercontent.com/cycleapple/DalamudPlugins-TW/main/'
              if icon_url.startswith(prefix):
                  icon_path = icon_url[len(prefix):]
                  if not Path(icon_path).exists():
                      raise SystemExit(f'Entry {index} IconUrl points to missing file: {icon_path}')

          print('repo.json validation passed')
          PY

      - name: Validate local plugin packages
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          plugin_dir = Path('plugins')
          if not plugin_dir.exists():
              print('No plugins directory found; skipping local package validation')
              raise SystemExit(0)

          packages = sorted(plugin_dir.glob('*.zip'))
          if not packages:
              print('No plugins/*.zip packages found; skipping local package validation')
              raise SystemExit(0)

          for package in packages:
              if not zipfile.is_zipfile(package):
                  raise SystemExit(f'Package is not a valid ZIP: {package}')
              with zipfile.ZipFile(package) as archive:
                  names = archive.namelist()
                  if not any(name.lower().endswith('.json') for name in names):
                      raise SystemExit(f'{package} does not contain a manifest JSON file')
                  if not any(name.lower().endswith('.dll') for name in names):
                      raise SystemExit(f'{package} does not contain a plugin DLL file')

          print('Local plugin package validation passed')
          PY
